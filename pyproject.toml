[project]
name = "kodict"
version = "0.1.0"
description = "Wikipedia-mined Korean dictionary for AOSP keyboard forks"
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
kodict = "kodict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
